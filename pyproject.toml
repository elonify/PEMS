[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pems"
version = "0.0.0"
description = "Elonify Petroleum Economics Modeling System (PEMS) — Phase 0 scaffold"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "PEMS Project" }]
dependencies = [
  "openpyxl>=3.1",
  "PySide6>=6.6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pems = "pems.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
